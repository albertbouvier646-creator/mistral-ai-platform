<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Qwen 27B Heretic — Chat</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 30px auto; padding: 0 12px; background: #111; color: #eee; }
  h2 { margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 16px; }
  #setup { display: flex; gap: 8px; margin-bottom: 16px; }
  #setup input { flex: 1; padding: 8px; background: #1b1b1b; border: 1px solid #333; color: #eee; border-radius: 6px; }
  #log { border: 1px solid #333; border-radius: 8px; padding: 14px; min-height: 360px; max-height: 60vh; overflow-y: auto; white-space: pre-wrap; background: #1b1b1b; }
  .msg-user { color: #7dc4ff; font-weight: 600; margin-top: 10px; }
  .msg-ai { color: #eee; margin-top: 4px; }
  .msg-status { color: #888; font-style: italic; }
  #row { display: flex; gap: 8px; margin-top: 12px; }
  #row input { flex: 1; padding: 10px; background: #1b1b1b; border: 1px solid #333; color: #eee; border-radius: 6px; }
  button { padding: 10px 18px; border: none; border-radius: 6px; background: #2563eb; color: white; cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<h2>Qwen 27B Heretic — Chat</h2>
<p class="sub">1er message = jusqu'à ~9 min (réveil du serveur GPU). Les suivants sont rapides tant que le chat reste actif.</p>

<div id="setup">
  <input id="passcode" type="password" placeholder="Code d'accès (si demandé)" autocomplete="off">
</div>

<div id="log"></div>
<div id="row">
  <input id="input" placeholder="Écris ton message..." onkeydown="if(event.key==='Enter') send()">
  <button id="sendBtn" onclick="send()">Envoyer</button>
</div>

<script>
const history = [];

function append(cls, text) {
  const log = document.getElementById('log');
  const div = document.createElement('div');
  div.className = cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

async function send() {
  const passcode = document.getElementById('passcode').value.trim();
  const input = document.getElementById('input');
  const message = input.value.trim();
  if (!message) return;

  input.value = '';
  document.getElementById('sendBtn').disabled = true;
  append('msg-user', 'Toi: ' + message);
  history.push({ role: 'user', content: message });
  const statusLine = append('msg-status', "Envoi... (peut prendre jusqu'à 9 min au premier message)");

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Passcode': passcode },
      body: JSON.stringify({ messages: history, max_tokens: 768, temperature: 0.7 }),
    });
    const data = await resp.json();
    statusLine.remove();

    if (!resp.ok) {
      append('msg-status', 'Erreur: ' + (data.detail || resp.status));
      return;
    }

    append('msg-ai', 'IA: ' + data.reply);
    history.push({ role: 'assistant', content: data.reply });
  } catch (e) {
    statusLine.textContent = 'Erreur: ' + e.message;
  } finally {
    document.getElementById('sendBtn').disabled = false;
  }
}
</script>
</body>
</html>
