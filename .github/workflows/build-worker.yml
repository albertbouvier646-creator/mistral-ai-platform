name: Build RunPod worker image

on:
  push:
    branches: [main]
    paths:
      - "runpod-worker/**"
      - ".github/workflows/build-worker.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./runpod-worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mistral-ai-platform-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
